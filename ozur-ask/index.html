<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sadece sen…</title>
  <meta name="description" content="Sana özel, kalbimden bir sayfa." />
  <meta name="theme-color" content="#ffb3c6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #3d2430;
      --rose: #e36b84;
      --rose-deep: #c44763;
      --soft: rgba(61, 36, 48, 0.68);
      --paper: rgba(255, 250, 251, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100dvh;
      color: var(--ink);
      font-family: "Manrope", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 90% 70% at 8% 0%, #ffc9d7 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 100% 100%, #ffb8cb 0%, transparent 50%),
        linear-gradient(165deg, #fff1f5 0%, #ffd9e4 48%, #f5c0d0 100%);
      overflow-x: hidden;
    }

    .sky, .burst {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .burst { z-index: 50; }
    .sky i {
      position: absolute;
      bottom: -2rem;
      color: rgba(227, 107, 132, 0.34);
      font-style: normal;
      animation: drift linear infinite;
      user-select: none;
    }
    @keyframes drift {
      0% { transform: translateY(0) rotate(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(30deg) scale(1.25); opacity: 0; }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(520px, 100%);
      margin: 0 auto;
      padding: 0 0 3.5rem;
    }

    .hero {
      position: relative;
      min-height: 100dvh;
      display: grid;
      align-items: end;
      overflow: hidden;
    }
    .hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      animation: ken 18s ease-in-out infinite alternate;
    }
    @keyframes ken {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(61, 36, 48, 0.12) 0%, rgba(61, 36, 48, 0.18) 35%, rgba(61, 36, 48, 0.78) 100%);
      z-index: 1;
    }
    .hero-copy {
      position: relative;
      z-index: 2;
      padding: 2rem 1.35rem 2.4rem;
      color: #fff;
      text-align: center;
      animation: rise 0.9s ease both;
    }
    .script {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.6rem, 11vw, 3.8rem);
      line-height: 1.1;
      text-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }
    .hero .serif {
      margin: 0.7rem auto 1.35rem;
      max-width: 22rem;
      color: rgba(255, 255, 255, 0.92);
      font-size: clamp(1.15rem, 3.8vw, 1.35rem);
    }
    .serif {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      line-height: 1.45;
    }

    .cta {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #fff;
      background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
      padding: 0.95rem 1.4rem;
      border-radius: 999px;
      width: min(100%, 280px);
      box-shadow: 0 14px 34px rgba(196, 71, 99, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }
    .cta:hover { transform: translateY(-2px); }
    .cta:active { transform: translateY(1px); }
    .hero .cta {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    section.block {
      padding: 2.6rem 1.25rem 0.5rem;
      text-align: center;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .block h2.script {
      color: var(--rose-deep);
      font-size: clamp(2.2rem, 9vw, 3rem);
      margin-bottom: 1rem;
      text-shadow: none;
    }

    .compliment {
      position: relative;
      margin: 0 auto 0.9rem;
      max-width: 28rem;
      padding: 1.2rem 1.25rem;
      border-radius: 22px;
      background: var(--paper);
      border: 1px solid rgba(227, 107, 132, 0.18);
      box-shadow: 0 10px 30px rgba(196, 71, 99, 0.08);
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .compliment.on { opacity: 1; transform: none; }
    .compliment p {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.35rem, 5vw, 1.65rem);
      font-style: italic;
      line-height: 1.35;
      color: var(--rose-deep);
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-top: 0.2rem;
    }
    .gallery figure {
      position: relative;
      margin: 0;
      overflow: hidden;
      border-radius: 18px;
      aspect-ratio: 3 / 4;
      background: #ffd0dc;
    }
    .gallery figure.wide {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 11;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }
    .gallery figure:hover img { transform: scale(1.04); }

    .finale {
      padding: 3rem 1.25rem 2rem;
      text-align: center;
    }

    .burst b {
      position: absolute;
      font-weight: 400;
      animation: pop 1.5s ease-out forwards;
      font-size: 1.25rem;
      left: 50%;
      top: 50%;
    }
    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.35); opacity: 0; }
    }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 45;
      background: radial-gradient(circle at center, rgba(255, 182, 193, 0.55), transparent 55%);
      opacity: 0;
    }
    .flash.on {
      animation: flash 0.9s ease-out;
    }
    @keyframes flash {
      0% { opacity: 0; }
      25% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (max-width: 380px) {
      .gallery { gap: 0.4rem; }
      .gallery figure { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="burst" id="burst" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <main class="wrap">
    <header class="hero">
      <img class="hero-photo" src="photos/07.jpg" alt="Biz" fetchpriority="high" />
      <div class="hero-copy">
        <h1 class="script" id="title">Sadece sen…</h1>
        <p class="serif">Kalbimin en yumuşak yerinden, sana özel bir şey bıraktım.</p>
        <button class="cta" type="button" id="openBtn">Aç bakayım 💗</button>
      </div>
    </header>

    <section class="block" id="iltifatlar" hidden>
      <h2 class="script">Sen…</h2>
      <div id="compliments"></div>
    </section>

    <section class="block" id="anilar" hidden>
      <h2 class="script">Bizim anılar</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="finale" id="son" hidden>
      <button class="cta" type="button" id="heartBtn">Kalpler 💗</button>
    </section>
  </main>

  <script>
    const compliments = [
      "Sen benim en değerlimsin",
      "Sevgilim",
      "Her şeyim oldun bana",
      "Birtanem",
      "Seni çok seviyorum",
    ];

    const photos = [
      "photos/01.jpg",
      "photos/02.jpg",
      "photos/03.jpg",
      "photos/04.jpg",
      "photos/05.jpg",
      "photos/07.jpg",
      "photos/09.jpg",
      "photos/10.jpg",
      "photos/11.jpg",
      "photos/12.jpg",
      "photos/06.jpg",
      "photos/08.jpg",
    ];

    const list = document.getElementById("compliments");
    compliments.forEach((text, i) => {
      const el = document.createElement("article");
      el.className = "compliment";
      el.innerHTML = `<p>${text}</p>`;
      el.style.transitionDelay = `${0.08 + i * 0.08}s`;
      list.appendChild(el);
    });

    const gallery = document.getElementById("gallery");
    photos.forEach((src, i) => {
      const fig = document.createElement("figure");
      if (i === 0 || i === 5 || i === 8) fig.classList.add("wide");
      fig.innerHTML = `<img src="${src}" alt="" loading="lazy" />`;
      gallery.appendChild(fig);
    });

    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add("on"); }),
      { threshold: 0.2 },
    );
    document.querySelectorAll(".compliment").forEach((el) => io.observe(el));

    // Always-flying hearts in background
    const sky = document.getElementById("sky");
    for (let n = 0; n < 36; n += 1) {
      const el = document.createElement("i");
      el.textContent = Math.random() > 0.25 ? "♡" : "💗";
      el.style.left = `${Math.random() * 100}%`;
      el.style.fontSize = `${0.75 + Math.random() * 1.5}rem`;
      el.style.animationDuration = `${7 + Math.random() * 12}s`;
      el.style.animationDelay = `${Math.random() * 10}s`;
      sky.appendChild(el);
    }

    function burstHearts(count = 40) {
      const layer = document.getElementById("burst");
      const glyphs = ["💗", "💞", "💕", "💘", "♡", "💖"];
      for (let n = 0; n < count; n += 1) {
        const b = document.createElement("b");
        b.textContent = glyphs[n % glyphs.length];
        b.style.fontSize = `${1 + Math.random() * 1.4}rem`;
        const angle = (Math.PI * 2 * n) / count + Math.random() * 0.2;
        const dist = 70 + Math.random() * 220;
        b.style.setProperty("--x", `${Math.cos(angle) * dist}px`);
        b.style.setProperty("--y", `${Math.sin(angle) * dist}px`);
        b.style.animationDelay = `${Math.random() * 0.25}s`;
        layer.appendChild(b);
        setTimeout(() => b.remove(), 1700);
      }
    }

    function flash() {
      const el = document.getElementById("flash");
      el.classList.remove("on");
      void el.offsetWidth;
      el.classList.add("on");
    }

    document.getElementById("openBtn").addEventListener("click", () => {
      burstHearts(48);
      flash();
      ["iltifatlar", "anilar", "son"].forEach((id) => {
        document.getElementById(id).hidden = false;
      });
      document.querySelectorAll(".compliment").forEach((el) => {
        setTimeout(() => el.classList.add("on"), 120);
      });
      setTimeout(() => {
        document.getElementById("iltifatlar").scrollIntoView({ behavior: "smooth", block: "start" });
      }, 180);
    });

    document.getElementById("heartBtn").addEventListener("click", () => {
      burstHearts(56);
      flash();
    });

    const name = new URLSearchParams(location.search).get("ad");
    if (name) {
      const safe = name.trim().slice(0, 24);
      if (safe) {
        document.getElementById("title").textContent = `${safe}…`;
        document.title = `${safe} için…`;
      }
    }
  </script>
</body>
</html>
