<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EGEXZON · THREAT RADAR</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/radar.css" />
</head>
<body>
  <div class="scanlines"></div>
  <div class="hud">
    <header class="top-bar">
      <div class="logo">
        <span class="logo-pulse"></span>
        <h1>EGEXZON</h1>
        <span class="sub">THREAT RADAR // LIVE</span>
      </div>
      <div class="stats">
        <div class="stat"><span id="statTotal">0</span><label>YAKALANAN</label></div>
        <div class="stat"><span id="statLive">0</span><label>CANLI</label></div>
        <div class="stat"><span class="blink">●</span><label>AKTİF</label></div>
      </div>
    </header>

    <aside class="feed-panel">
      <h2>▰ SALDIRI AKIŞI</h2>
      <div id="feed" class="feed"></div>
    </aside>

    <div id="map"></div>

    <div class="target-badge">
      <div class="spike"></div>
      <div class="target-label">egexzon</div>
      <div class="target-sub">KORUMA AĞI · TR</div>
    </div>

    <footer class="bottom-bar">
      <span>▸ CANLI TEHDİT İSTİHBARATI</span>
      <span id="clock">--:--:--</span>
      <span>▸ HEDEF: EGEXZON</span>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/radar.js"></script>
</body>
</html>
