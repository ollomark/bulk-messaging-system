<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1f22" />
    <title>XZON — Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/xzon/css/app.css" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-card">
        <div class="boot-mark">XZ</div>
        <h1>XZON</h1>
        <p>Canlı topluluk sohbeti</p>
        <form id="joinForm" class="join-form" autocomplete="off">
          <label for="displayName">Görünen ad</label>
          <input
            id="displayName"
            name="displayName"
            maxlength="24"
            minlength="2"
            placeholder="Örn. Shadow"
            required
            autofocus
          />
          <button type="submit" id="joinBtn">Sohbete Katıl</button>
          <p class="boot-error hidden" id="bootError"></p>
          <p class="boot-hint">Mesajlar anlık ve herkese açık. Küfür / spam yasak.</p>
        </form>
      </div>
    </div>

    <div id="app" class="app hidden" aria-hidden="true">
      <aside class="rail" aria-label="Sunucular">
        <button class="pill home" type="button" title="XZON" aria-current="page">XZ</button>
        <div class="rail-sep"></div>
        <div class="pill ghost" title="Live">●</div>
      </aside>

      <aside class="sidebar">
        <header class="guild-head">
          <div>
            <strong>X Z O N #SORGU</strong>
            <small id="connLabel">bağlanıyor…</small>
          </div>
          <span class="live-dot" id="liveDot" title="Canlı"></span>
        </header>

        <nav class="channel-nav" id="channelNav" aria-label="Kanallar"></nav>

        <footer class="me-bar">
          <div class="me">
            <div class="avatar" id="meAvatar">?</div>
            <div class="me-text">
              <strong id="meName">—</strong>
              <small id="meSub">Çevrimiçi</small>
            </div>
          </div>
          <button type="button" class="icon-btn" id="logoutBtn" title="Çıkış">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path
                d="M10 17v-2h4v-2h-4v-2l-4 3 4 3zm9-13H5c-1.1 0-2 .9-2 2v4h2V6h14v12H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"
              />
            </svg>
          </button>
        </footer>
      </aside>

      <main class="stage">
        <header class="stage-head">
          <div class="title-wrap">
            <span class="hash">#</span>
            <h1 id="channelTitle">genel</h1>
            <div class="vbar"></div>
            <p id="channelTopic">Ana sohbet</p>
          </div>
          <div class="stage-meta">
            <span id="onlineBadge">0 online</span>
          </div>
        </header>

        <div class="messages" id="messages" role="log" aria-live="polite"></div>
        <div class="typing hidden" id="typing"></div>

        <form class="composer" id="composer">
          <div class="composer-box">
            <input
              id="messageInput"
              type="text"
              maxlength="1800"
              autocomplete="off"
              placeholder="Mesaj yaz…"
            />
            <button type="submit" class="send-btn" id="sendBtn" title="Gönder">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
              </svg>
            </button>
          </div>
        </form>
      </main>

      <aside class="members" id="membersPane">
        <h3>ÇEVRİMİÇİ — <span id="onlineCount">0</span></h3>
        <div id="onlineList"></div>
      </aside>
    </div>

    <div class="toast hidden" id="toast"></div>
    <script src="/xzon/js/app.js" type="module"></script>
  </body>
</html>
