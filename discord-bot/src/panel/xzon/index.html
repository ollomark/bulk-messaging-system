<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XZON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/xzon/css/app.css" />
  </head>
  <body>
    <!-- Login (Discord-style) -->
    <div id="loginScreen" class="login">
      <div class="login-bg"></div>
      <form class="login-card" id="loginForm">
        <h1>Tekrar hoş geldin!</h1>
        <p class="login-sub">Seni özledik!</p>
        <label>
          E-posta veya Telefon Numarası
          <input id="loginUser" type="text" value="sen@xzon.app" required />
        </label>
        <label>
          Şifre
          <input id="loginPass" type="password" value="••••••••" required />
        </label>
        <a class="login-link" href="#">Şifreni mi unuttun?</a>
        <button type="submit" class="login-btn">Giriş Yap</button>
        <p class="login-foot">
          Bir hesabın mı yok?
          <a href="#">Kayıt Ol</a>
        </p>
      </form>
    </div>

    <div class="app hidden" id="app">
      <!-- Server rail -->
      <nav class="servers" aria-label="Sunucular">
        <button class="server home" data-view="dms" title="Direkt Mesajlar" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2C6.48 2 2 6.15 2 11.25c0 2.94 1.5 5.56 3.84 7.28L5 22l4.08-1.63c.94.26 1.93.4 2.92.4 5.52 0 10-4.15 10-9.25S17.52 2 12 2zm1.1 12.45-2.55-2.73-4.98 2.73L12.3 7.8l2.62 2.8 4.9-2.8-6.72 7.65z"
            />
          </svg>
        </button>
        <div class="sep"></div>
        <button class="server pill active-guild" data-guild="xzon" title="X Z O N #SORGU" type="button">
          XZ
        </button>
        <button class="server pill" data-guild="ifsaxd" title="İFSAXD" type="button">IF</button>
        <button class="server add" title="Sunucu Ekle" type="button" id="addServerBtn">+</button>
        <button class="server discover" title="Keşfet" type="button" id="discoverBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
          </svg>
        </button>
      </nav>

      <!-- Channels / Friends -->
      <aside class="channels" id="sidebar">
        <header class="guild-header" id="sidebarHeader">
          <button type="button" id="guildMenuBtn">
            <span id="guildName">X Z O N #SORGU</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M7 10l5 5 5-5H7z" />
            </svg>
          </button>
        </header>

        <div class="channel-scroll" id="channelList"></div>

        <div class="voice-panel hidden" id="voicePanel">
          <div class="voice-status">
            <strong id="voiceStatusText">Ses Bağlantısı</strong>
            <small id="voiceChannelName">Lobby</small>
          </div>
          <div class="voice-actions">
            <button type="button" title="Kamerayı Aç" id="camBtn">
              <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
            <button type="button" title="Ekran Paylaş" id="shareBtn">
              <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2h4v-2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            </button>
            <button type="button" class="danger" title="Bağlantıyı Kes" id="disconnectVoice">
              <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 010-1.41C3.34 8.6 7.46 7 12 7s8.66 1.6 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </button>
          </div>
        </div>

        <footer class="user-bar">
          <button class="me" type="button" id="statusBtn" title="Durum">
            <div class="avatar online" id="meAvatar">S</div>
            <div class="me-meta">
              <strong id="meName">Sen</strong>
              <small id="meStatus">Çevrimiçi</small>
            </div>
          </button>
          <div class="user-actions">
            <button title="Mikrofon" type="button" id="micBtn" aria-label="Mikrofon" class="on">
              <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
            </button>
            <button title="Kulaklık" type="button" id="deafBtn" aria-label="Kulaklık" class="on">
              <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 00-9 9v7a2 2 0 002 2h3v-8H5v-1a7 7 0 0114 0v1h-3v8h3a2 2 0 002-2v-7a9 9 0 00-9-9z"/></svg>
            </button>
            <button title="Kullanıcı Ayarları" type="button" id="settingsBtn" aria-label="Ayarlar">
              <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.43 7.43 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.2 7.2 0 00-1.62-.94l-.36-2.54A.5.5 0 0013.9 2h-3.8a.5.5 0 00-.5.42l-.36 2.54c-.58.23-1.12.54-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.71 8.84a.5.5 0 00.12.64l2.03 1.58c-.05.31-.08.63-.08.94s.03.63.08.94L2.83 14.5a.5.5 0 00-.12.64l1.92 3.32c.14.24.43.34.69.22l2.39-.96c.5.4 1.04.71 1.62.94l.36 2.54c.05.24.26.42.5.42h3.8c.24 0 .45-.18.5-.42l.36-2.54c.58-.23 1.12-.54 1.62-.94l2.39.96c.26.1.55 0 .69-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8a3.5 3.5 0 010 7.5z"/></svg>
            </button>
          </div>
        </footer>
      </aside>

      <!-- Main chat / friends -->
      <section class="chat" id="chatPane">
        <header class="chat-top">
          <div class="chat-title">
            <span class="hash" id="titleIcon">#</span>
            <h1 id="channelTitle">genel</h1>
            <div class="divider" id="topicDivider"></div>
            <p id="channelTopic">Sunucunun ana sohbet kanalı — saygılı ol, spam yapma.</p>
          </div>
          <div class="chat-tools">
            <button title="Sabitlemeler" type="button" id="pinsBtn" aria-label="Sabitlemeler">
              <svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
            </button>
            <button title="Üyeler" id="toggleMembers" type="button" aria-label="Üyeler">
              <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </button>
            <input class="search" id="searchInput" type="search" placeholder="Ara" />
          </div>
        </header>

        <div class="messages" id="messages"></div>
        <div class="typing hidden" id="typing"><span></span><span></span><span></span> <em id="typingText">biri yazıyor…</em></div>

        <form class="composer" id="composer">
          <button type="button" class="plus" title="Dosya ekle" id="attachBtn" aria-label="Dosya ekle">+</button>
          <div class="input-wrap">
            <input
              id="messageInput"
              type="text"
              autocomplete="off"
              placeholder="#genel kanalına mesaj gönder"
            />
          </div>
          <div class="composer-icons">
            <button type="button" title="Hediye" aria-label="Hediye">🎁</button>
            <button type="button" title="GIF" class="gif-btn">GIF</button>
            <button type="button" title="Sticker" aria-label="Sticker">✦</button>
            <button type="button" title="Emoji" aria-label="Emoji" id="emojiBtn">☺</button>
          </div>
          <button type="submit" class="send">Gönder</button>
        </form>
      </section>

      <!-- Members -->
      <aside class="members" id="membersPanel">
        <div id="membersContent"></div>
      </aside>
    </div>

    <!-- Status menu -->
    <div class="popover hidden" id="statusMenu">
      <button data-status="online" type="button"><i class="dot online"></i> Çevrimiçi</button>
      <button data-status="idle" type="button"><i class="dot idle"></i> Boşta</button>
      <button data-status="dnd" type="button"><i class="dot dnd"></i> Rahatsız Etmeyin</button>
      <button data-status="offline" type="button"><i class="dot offline"></i> Görünmez</button>
    </div>

    <!-- User profile popout -->
    <div class="profile-pop hidden" id="profilePop">
      <div class="profile-banner" id="profileBanner"></div>
      <div class="profile-avatar avatar online" id="profileAvatar">S</div>
      <div class="profile-body">
        <h2 id="profileName">Sen</h2>
        <p id="profileTag">sen#0001</p>
        <div class="profile-section">
          <h4>HAKKINDA</h4>
          <p id="profileAbout">XZON kullanıcısı</p>
        </div>
        <div class="profile-section">
          <h4>ROL</h4>
          <div class="role-pill" id="profileRole">Üye</div>
        </div>
        <button type="button" class="profile-msg" id="profileMsgBtn">Mesaj Gönder</button>
      </div>
    </div>

    <!-- Settings modal -->
    <div class="modal-backdrop hidden" id="settingsModal">
      <div class="settings">
        <aside class="settings-nav">
          <h3>Kullanıcı Ayarları</h3>
          <button class="active" data-tab="account" type="button">Hesabım</button>
          <button data-tab="profile" type="button">Profiller</button>
          <button data-tab="privacy" type="button">Gizlilik</button>
          <button data-tab="appearance" type="button">Görünüm</button>
          <button data-tab="voice" type="button">Ses & Video</button>
          <hr />
          <button data-tab="logout" class="danger" type="button">Çıkış Yap</button>
        </aside>
        <section class="settings-pane" id="settingsPane"></section>
        <button class="settings-close" id="closeSettings" type="button" aria-label="Kapat">✕</button>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <!-- Mobile bottom bar -->
    <nav class="mobile-bar hidden" id="mobileBar">
      <button type="button" data-mobile="servers">Sunucular</button>
      <button type="button" data-mobile="channels">Kanallar</button>
      <button type="button" data-mobile="chat" class="active">Sohbet</button>
      <button type="button" data-mobile="members">Üyeler</button>
    </nav>

    <script src="/xzon/js/app.js"></script>
  </body>
</html>
