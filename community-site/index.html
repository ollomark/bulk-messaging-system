<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1f22" />
    <title>XZON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-card">
        <div class="boot-mark">XZ</div>
        <h1>XZON</h1>
        <p>Discord tarzı canlı istemci</p>
        <form id="joinForm" class="join-form" autocomplete="off">
          <label for="displayName">Görünen ad</label>
          <input id="displayName" maxlength="24" minlength="2" placeholder="Örn. Shadow" required autofocus />
          <button type="submit" id="joinBtn">Giriş Yap</button>
          <p class="boot-error hidden" id="bootError"></p>
          <p class="boot-hint">DM · tepki · yanıt · ses odaları · sabitleme · arama</p>
        </form>
      </div>
    </div>

    <div id="app" class="app hidden">
      <aside class="rail">
        <button class="pill dm-pill" id="dmHomeBtn" type="button" title="Direkt Mesajlar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2C6.48 2 2 6.15 2 11.25c0 2.94 1.5 5.56 3.84 7.28L5 22l4.08-1.63c.94.26 1.93.4 2.92.4 5.52 0 10-4.15 10-9.25S17.52 2 12 2z"/></svg>
        </button>
        <div class="rail-sep"></div>
        <div id="guildRail"></div>
      </aside>

      <aside class="sidebar">
        <header class="guild-head" id="sidebarHead"></header>
        <nav class="channel-nav" id="channelNav"></nav>

        <div class="voice-panel hidden" id="voicePanel">
          <div>
            <strong id="voiceTitle">Ses Bağlantısı</strong>
            <small id="voiceName">Lobby</small>
          </div>
          <div class="voice-btns">
            <button type="button" id="camBtn" title="Kamera">캠</button>
            <button type="button" id="shareBtn" title="Ekran">▣</button>
            <button type="button" class="danger" id="leaveVoiceBtn" title="Ayrıl">✕</button>
          </div>
        </div>

        <footer class="me-bar">
          <button class="me" type="button" id="statusBtn">
            <div class="avatar online" id="meAvatar">?</div>
            <div class="me-text">
              <strong id="meName">—</strong>
              <small id="meSub">Çevrimiçi</small>
            </div>
          </button>
          <div class="me-actions">
            <button type="button" class="icon-btn on" id="micBtn" title="Mikrofon">🎙</button>
            <button type="button" class="icon-btn on" id="deafBtn" title="Kulaklık">🎧</button>
            <button type="button" class="icon-btn" id="settingsBtn" title="Ayarlar">⚙</button>
          </div>
        </footer>
      </aside>

      <main class="stage">
        <header class="stage-head">
          <div class="title-wrap">
            <span class="hash" id="titleIcon">#</span>
            <h1 id="channelTitle">genel</h1>
            <div class="vbar"></div>
            <p id="channelTopic">Ana sohbet</p>
          </div>
          <div class="stage-tools">
            <button type="button" class="icon-btn" id="pinsBtn" title="Sabitlemeler">📌</button>
            <button type="button" class="icon-btn" id="membersBtn" title="Üyeler">👥</button>
            <input class="search" id="searchInput" type="search" placeholder="Ara" />
          </div>
        </header>

        <div class="messages" id="messages"></div>
        <div class="typing hidden" id="typing"></div>

        <div class="reply-bar hidden" id="replyBar">
          <span id="replyLabel">Yanıtlanıyor</span>
          <button type="button" id="cancelReply">✕</button>
        </div>

        <form class="composer" id="composer">
          <div class="composer-box">
            <button type="button" class="plus" id="emojiBtn" title="Emoji">☺</button>
            <input id="messageInput" type="text" maxlength="1800" autocomplete="off" placeholder="Mesaj yaz…" />
            <button type="button" class="gif" id="gifBtn">GIF</button>
            <button type="submit" class="send-btn" id="sendBtn">➤</button>
          </div>
        </form>
      </main>

      <aside class="members" id="membersPane">
        <div id="membersContent"></div>
      </aside>
    </div>

    <div class="popover hidden" id="statusMenu"></div>
    <div class="popover emoji-pop hidden" id="emojiPop"></div>
    <div class="profile-pop hidden" id="profilePop"></div>
    <div class="drawer hidden" id="pinsDrawer">
      <header><strong>Sabitlenmiş Mesajlar</strong><button type="button" id="closePins">✕</button></header>
      <div id="pinsList"></div>
    </div>
    <div class="modal-backdrop hidden" id="settingsModal">
      <div class="settings">
        <aside class="settings-nav" id="settingsNav"></aside>
        <section class="settings-pane" id="settingsPane"></section>
        <button class="settings-close" id="closeSettings" type="button">✕</button>
      </div>
    </div>
    <div class="toast hidden" id="toast"></div>
    <nav class="mobile-bar hidden" id="mobileBar">
      <button type="button" data-m="rail">Sunucu</button>
      <button type="button" data-m="channels">Kanallar</button>
      <button type="button" data-m="chat" class="active">Sohbet</button>
      <button type="button" data-m="members">Üyeler</button>
    </nav>

    <script src="js/app.js" type="module"></script>
  </body>
</html>
